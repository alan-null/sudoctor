---
- name: Safe application recovery without reboot
  hosts: servers
  become: true
  serial: 1
  tasks:
    - name: Ensure expected systemd services
      ansible.builtin.systemd:
        name: '{{ item }}'
        state: started
      loop: '{{ sudoctor_services }}'
    - name: Attempt idempotent tmux session recovery
      ansible.builtin.systemd:
        name: 'sudoctor-tmux-{{ item.name }}.service'
        state: started
      loop: '{{ sudoctor_tmux }}'
    - name: Check health
      ansible.builtin.command:
        argv: [python3, /usr/local/libexec/sudoctor-health.py, /etc/sudoctor/health.json]
      changed_when: false
      register: health_raw
    - name: Save report
      ansible.builtin.copy:
        content: "{{ health_raw.stdout | from_json | to_nice_json }}\n"
        dest: "{{ lookup('ansible.builtin.env', 'SUDOCTOR_REPORT_DIR') | default(playbook_dir ~ '/../reports', true) }}/{{ inventory_hostname }}.json"
        mode: '0600'
      delegate_to: localhost
      become: false
    - name: Fail on critical issues
      ansible.builtin.assert:
        that: (health_raw.stdout | from_json).status != 'critical'
